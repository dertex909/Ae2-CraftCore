plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }
    maven {
        name = "shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty('forge.logging.markers', 'REGISTRIES')
            systemProperty 'guideme.ae2.guide.sources', file("src/main/resources/assets/${project.mod_id}/ae2guide").getAbsolutePath()
            systemProperty 'guideme.ae2.guide.sourcesNamespace', project.mod_id
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.DEBUG
            additionalRuntimeClasspathConfiguration.extendsFrom(project.configurations.implementation)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // AE2
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    runtimeOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    // guideme
    compileOnly "org.appliedenergistics:guideme:21.1.17"
    runtimeOnly "org.appliedenergistics:guideme:21.1.17"

    // Extended AE 1.21-2.2.29-neoforge
    compileOnly "maven.modrinth:JiOqfoFM:4BXqcY77"
    runtimeOnly "maven.modrinth:JiOqfoFM:4BXqcY77"

    // Glodium 1.21-2.2-neoforge
    compileOnly "maven.modrinth:UhW5uCKw:pfbmdJ3b"
    runtimeOnly "maven.modrinth:UhW5uCKw:pfbmdJ3b"

    // ExtendedAE-Plus 1.5.5
    compileOnly "maven.modrinth:xr109llC:BdDOfMzg"


    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:19.25.0.325"
    // EMI
    compileOnly "dev.emi:emi-neoforge:1.1.22+${minecraft_version}"
    // REI
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:16.0.729"

    runtimeOnly "dev.emi:emi-neoforge:1.1.22+${minecraft_version}"

//    runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:16.0.729"
//    runtimeOnly "dev.architectury:architectury-neoforge:13.0.6"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var computedNeoVersionRange = "[${neo_version},)"

    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : computedNeoVersionRange,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             ae2_version            : ae2_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}